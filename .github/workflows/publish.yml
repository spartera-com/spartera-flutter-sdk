# spartera-flutter-sdk/.github/workflows/publish.yml
#
# Publishes to pub.dev when a version tag (v1.0.84) is pushed to THIS repo.
# The tag is pushed by spartera-com/backend's SDK Release workflow.
#
# pub.dev only accepts automated publishing from a tag push in the repository
# configured on the package's Admin page, with a tag that matches the version
# being published. One-time setup on pub.dev -> spartera_api_sdk -> Admin ->
# Automated publishing:
#   Repository:   spartera-com/spartera-flutter-sdk
#   Tag pattern:  v{{version}}
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
