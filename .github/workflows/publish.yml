# spartera-flutter-sdk/.github/workflows/publish.yml
#
# Publishes to pub.dev when a version tag (v1.0.84) is pushed to THIS repo.
# The tag is pushed by spartera-com/backend's SDK Release workflow.
#
# pub.dev -> spartera_api_sdk -> Admin -> Automated publishing must have:
#   Repository:   spartera-com/spartera-flutter-sdk
#   Tag pattern:  v{{version}}
#
# --force publishes despite validation warnings (unawaited futures in the
# generated api_client.dart, no version constraint on intl). Those warnings
# don't block pub.dev; they only lower the package's pub points.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check the tag matches pubspec.yaml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag v$TAG doesn't match pubspec.yaml version $PUBSPEC"
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Publish
        run: dart pub publish --force